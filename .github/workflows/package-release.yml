name: Package desktop and Android apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the packaged artifacts as the configured version
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.1.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packaging/package.json
      - run: npm ci --prefix packaging
      - run: npm test --prefix packaging

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packaging/package.json
      - run: npm ci --prefix packaging
      - run: npm run desktop:dist --prefix packaging
      - name: Create Windows checksums
        shell: pwsh
        run: Get-ChildItem packaging/release/windows/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content packaging/release/windows/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anime-kill-windows
          path: |
            packaging/release/windows/*.exe
            packaging/release/windows/SHA256SUMS-windows.txt

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packaging/package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --prefix packaging
      - run: npm run android:prepare --prefix packaging
      - run: chmod +x packaging/android/gradlew
      - run: cd packaging/android && ./gradlew assembleDebug
      - name: Collect Android package
        run: |
          mkdir -p packaging/release/android
          cp packaging/android/app/build/outputs/apk/debug/app-debug.apk packaging/release/android/anime-kill-demo-0.1.1-debug.apk
          cd packaging/release/android
          sha256sum anime-kill-demo-0.1.1-debug.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: anime-kill-android
          path: packaging/release/android/*

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: '))
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: anime-kill-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: 动漫杀 Demo ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.PACKAGE_VERSION) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.PACKAGE_VERSION) }}
          target_commitish: ${{ github.sha }}
          body_path: packaging/RELEASE_NOTES.md
          files: release/*
